<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | E-Skills Academy</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/apply.css">
</head>
<body>
    <nav>
        <a href="index.html"><img src="logo/Asset 1.svg" alt="E-Skills Academy" class="logo-img"></a>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT US</a></li>
            <li><a href="courses.html">COURSES</a></li>
            <li><a href="fees-structure.html">F.STRUCTURE</a></li>
            <li><a href="contact.html">CONTACT US</a></li>
            <li><a href="apply.html">APPLY</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 700px;">
        <h1 class="section-title" style="font-size: 40px;">Apply Now</h1>
        <p class="section-subtitle">Fill out the form below to register for your desired course.</p>

        <form class="apply-form">
            <h3>Personal Information</h3>
            
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div> 

            <h3 style="margin-top: 30px;">Course Information</h3>
            <div class="form-group">
                <label for="courseSelect">Choose a Course</label>
                <select id="courseSelect">
                    <option value="Graphic">Graphics Design</option>
                    <option value="Web">Web Development</option>
                    <option value="Carpentry">Carpentry</option>
                    <option value="Computerrepair">Computer Repair</option>
                    <option value="Catering">Catering</option>
                    <option value="Welding">Welding</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label for="reason">Why do you want to join?</label>
                <textarea id="reason" rows="4" placeholder="Tell us briefly why you want to learn this skill..."></textarea>
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Submit Application</button>
        </form>
    </div>
</body>
</html>
