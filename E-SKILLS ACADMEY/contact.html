        <h1 class="section-title" style="font-size: 40px;">Contact Us</h1>
        <p class="section-subtitle">Get in touch with us for inquiries, questions, or support.</p>

        <div class="contact-grid">
            <div class="contact-info">
                <h3>E-SKILLS ACADEMY</h3>
                <p><strong>Email:</strong> learn@eskillsacademy.com</p>
                <p><strong>Phone:</strong> +256 764 869851</p>

            </div>
            
            <div class="contact-form-box">
                <h3>Send Us a Message</h3>
                <form>
                    <div style="margin-bottom: 15px;">
                        <input type="text" placeholder="Your Name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <input type="email" placeholder="Your Email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <textarea placeholder="Ask us anything..." rows="4" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>
